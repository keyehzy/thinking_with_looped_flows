[project]
name = "looped-flows"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "huggingface-hub>=1.31.0",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "torch>=2.14.0",
    "tqdm>=4.70.0",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# torch on PyPI ships CUDA 13 runtime wheels on Linux; pin the cu126 build so it
# works on drivers older than 580. macOS (MPS) keeps the default PyPI wheel.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
