# ARC-AGI-1 (+ ConceptARC for training, evaluation-set demonstrations for puzzle embeddings).
task:
  name: arc
  num_aug: 1000
  num_test_aug: 1000
  sources:
    - {path: data/raw/ARC-AGI/data/training, role: train}
    - {path: data/raw/ARC-AGI/data/evaluation, role: test}
    - {path: data/raw/ConceptARC/corpus, role: train}
model: {mixer: attention, L_cycles: 4}
train:
  total_steps: 200000
  batch_size: 768
  k: 16
  time_sampler: random_start
  pseudotargets: false
  lr: 1.0e-4
  warmup_steps: 2000
  lr_schedule: constant
  weight_decay: 0.1
  puzzle_emb_lr: 1.0e-4
  puzzle_emb_weight_decay: 1.0
sample: {n_steps: 64, gamma: 5.0}
eval: {every: 20000, batch_size: 256, save_dir: runs/arc1}
