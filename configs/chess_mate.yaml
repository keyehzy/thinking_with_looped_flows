# Stage 1: mate-in-N positions from the Lichess puzzle database.
# Data: uv run python scripts/prepare_chess.py puzzles data/raw/lichess/lichess_db_puzzle.csv.zst data/chess/mate
task: {name: chess, root: data/chess/mate, target: any, augment: true}
model: {mixer: attention, L_cycles: 4}
train:
  total_steps: 100000
  batch_size: 768
  k: 16
  time_sampler: sorted
  lr: 1.0e-4
  warmup_steps: 2000
  lr_schedule: constant
  weight_decay: 1.0
  log_every: 100
sample: {n_steps: 16, gamma: 5.0}
eval: {every: 10000, batch_size: 256, num_samples: 20, limit: 2000, save_dir: runs/chess_mate}
