# Maze-Hard: 7M transformer denoiser.
task: {name: maze}
model: {mixer: attention, L_cycles: 4}
train:
  total_steps: 100000
  batch_size: 768
  k: 16
  time_sampler: sorted
  pseudotargets: false
  lr: 1.0e-4
  warmup_steps: 2000
  lr_schedule: constant
  weight_decay: 1.0
sample: {n_steps: 32, gamma: 1.0}
eval: {every: 10000, batch_size: 256, save_dir: runs/maze}
